[package]
name = "spiritbyte-linux"
version = "0.1.2"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[features]
ui-check = []

[[bin]]
name = "spiritbyte"
path = "src/main.rs"

[[example]]
name = "gif_decode_check"
required-features = ["ui-check"]

[dependencies]
spiritbyte-core = { path = "../core" }
gtk = { version = "0.18.2", features = ["v3_24"] }
glib = "0.18"
gdk-pixbuf = "0.18"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["webp"] }
gif = "0.14"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Pixel compositing and LZW decoding benefit from speed optimization; GTK and
# the application keep the compact release profile above.
[profile.release.package.image]
opt-level = 3
[profile.release.package.gif]
opt-level = 3
[profile.release.package.weezl]
opt-level = 3
